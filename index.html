<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello DevOps</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #152238;
      margin: 0;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      border-radius: 18px;
      padding: 48px;
      box-shadow: 0 12px 35px rgba(21, 34, 56, 0.12);
      text-align: center;
      max-width: 620px;
    }
    h1 { font-size: 44px; margin: 0 0 12px; }
    p { font-size: 20px; line-height: 1.5; margin: 10px 0; }
    .badge {
      display: inline-block;
      margin-top: 18px;
      padding: 8px 14px;
      border-radius: 999px;
      background: #e7f0ff;
      color: #1458c0;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Hello DevOps 👋</h1>
    <p>This page started as a normal HTML file.</p>
    <p>Then we served it from a VM, packaged it with Docker, and deployed it with Jenkins.</p>
    <span class="badge">Version 1</span>
  </main>
</body>
</html>
